server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      # ✅ GLOBAL CORS (Angular + Deployed Frontend)
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"   # Angular local
              - "https://quantity-measurement-app-front-end.vercel.app"  # deployed frontend
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      # ❌ Disable Eureka (Railway deployment)
      discovery:
        locator:
          enabled: false

      # ✅ Prevent duplicate CORS headers
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      # ✅ ROUTES (Using ENV VARIABLES for Railway)
      routes:

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/auth/**

        - id: measurement-service
          uri: ${MEASUREMENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/measurement/**
          filters:
            - PreserveHostHeader
            - RemoveRequestHeader=Cookie

        # ✅ Swagger Docs Routing (optional but recommended)
        - id: user-service-docs
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/user-service/v3/api-docs/**
          filters:
            - StripPrefix=1

        - id: measurement-service-docs
          uri: ${MEASUREMENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/measurement-service/v3/api-docs/**
          filters:
            - StripPrefix=1

# ❌ Disable Eureka completely
eureka:
  client:
    enabled: false

# ✅ Swagger Config (Gateway Aggregation)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: user-service
        url: /user-service/v3/api-docs
      - name: measurement-service
        url: /measurement-service/v3/api-docs

# ✅ Logging (debugging)
logging:
  level:
    org.springframework.cloud.gateway: INFO

# ✅ Health Monitoring (Railway friendly)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
