spring.application.name=USER-SERVICE

# ✅ Dynamic Port (Railway required)
server.port=${PORT:8082}

# ===============================
# ✅ DATABASE (Railway MySQL)
# ===============================
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# ✅ JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# ❌ REMOVE EUREKA (IMPORTANT)
# ===============================
eureka.client.enabled=false

# ===============================
# ✅ OAUTH (Google Login)
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# ✅ VERY IMPORTANT (Dynamic Redirect URL)
spring.security.oauth2.client.registration.google.redirect-uri=${USER_SERVICE_URL}/login/oauth2/code/google

# ===============================
# ✅ FRONTEND URL (Angular)
# ===============================
frontend.url=${FRONTEND_URL}

# ===============================
# ✅ SWAGGER
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ===============================
# ✅ LOGGING (Optional but useful)
# ===============================
logging.level.org.springframework.security=INFO
